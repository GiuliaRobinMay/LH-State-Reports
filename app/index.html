<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeskoHelp State Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --line:#D6DCE6; --line-strong:#B7C0CE;
  --ink:#14213D; --ink-2:#3B475C; --muted:#5B6779; --faint:#8A95A6;
  --accent:#1E7A4C; --accent-ink:#FFFFFF; --accent-soft:#DDF0E5;
  --hi:#F5C518; --hi-ink:#2B2300; --hi-soft:#FFF3C4;
  --video:#B8321F; --video-soft:#FBE4DF; --doc:#3A5BC7; --doc-soft:#E1E8FB;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px -12px rgba(20,33,61,.18);
  --radius:10px; --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151E; --surface:#182231; --surface-2:#1F2B3C; --line:#2A3748; --line-strong:#3B4A5E;
    --ink:#E6EBF2; --ink-2:#C3CBD8; --muted:#97A3B5; --faint:#6F7B8D;
    --accent:#4FC48C; --accent-ink:#06261A; --accent-soft:#163827;
    --hi:#F5C518; --hi-ink:#2B2300; --hi-soft:#3D3410;
    --video:#F08A78; --video-soft:#3E1F1A; --doc:#8FA8F0; --doc-soft:#1F2B4D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#182231; --surface-2:#1F2B3C; --line:#2A3748; --line-strong:#3B4A5E;
  --ink:#E6EBF2; --ink-2:#C3CBD8; --muted:#97A3B5; --faint:#6F7B8D;
  --accent:#4FC48C; --accent-ink:#06261A; --accent-soft:#163827;
  --hi:#F5C518; --hi-ink:#2B2300; --hi-soft:#3D3410;
  --video:#F08A78; --video-soft:#3E1F1A; --doc:#8FA8F0; --doc-soft:#1F2B4D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--hi);color:var(--hi-ink);display:grid;place-items:center;font:900 22px/1 var(--display);flex:none}
.brand b{font:700 17px/1.1 var(--font);letter-spacing:-.01em;display:block}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.spacer{flex:1}
.statebtn{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-weight:600;max-width:100%}
.statebtn .abbr{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;letter-spacing:.04em}
.statebtn svg{width:14px;height:14px;color:var(--muted)}
.search{position:relative;flex:1 1 260px;max-width:460px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line-strong);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:4px 8px;color:var(--muted);border-radius:999px}
.search .clear:hover{background:var(--surface-2)}

.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px}
#main{min-width:0}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.rail{display:none}}

/* ---------- state rail ---------- */
.rail{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:6px}
.rail h2{font:600 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px 8px}
.rail ul{list-style:none;margin:0;padding:0}
.rail li a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;text-decoration:none;color:var(--ink-2);font-size:14px}
.rail li a:hover{background:var(--surface-2);color:var(--ink)}
.rail li a[aria-current="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.rail li a .n{color:var(--faint);font-size:12px}
.rail li a[aria-current="true"] .n{color:var(--bg);opacity:.7}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin:6px 0 22px}
.hero h1{font:900 clamp(30px,4.6vw,46px)/1.02 var(--display);letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance;max-width:16ch}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.hero .lede em{font-style:normal;background:var(--hi-soft);padding:0 4px;border-radius:3px;color:var(--ink)}
.totals{display:flex;gap:22px;flex-wrap:wrap}
.totals div{text-align:right}
.totals b{display:block;font:900 30px/1 var(--display);letter-spacing:-.02em}
.totals span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:640px){.hero{grid-template-columns:1fr}.totals div{text-align:left}}

.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 26px}
.cat{display:flex;gap:10px;align-items:flex-start;padding:12px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none;color:inherit}
.cat:hover{border-color:var(--line-strong)}
.cat .ic{font-size:20px;line-height:1;flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--surface-2)}
.cat b{display:block;font-size:14px;line-height:1.25}
.cat small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}

.grid-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.grid-h h2{font:700 18px/1.2 var(--font);margin:0}
.grid-h span{color:var(--muted);font-size:13px}
.states{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.states a{min-width:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none;color:inherit}
.states a:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.states .abbr{grid-row:1/3;font:900 20px/1 var(--display);color:var(--accent);letter-spacing:-.02em;width:34px}
.states .nm{font-weight:600;font-size:14px;line-height:1.2}
.states .ct{color:var(--muted);font-size:12px;white-space:nowrap}

/* ---------- state view ---------- */
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 14px}
.shead h1{font:900 clamp(34px,5vw,54px)/1 var(--display);letter-spacing:-.025em;margin:0}
.shead .sub{color:var(--muted);margin-top:6px;font-size:14px}
.shead .sub b{color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 6px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;text-decoration:none;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:500;font-size:14px;white-space:nowrap}
.tab:hover{border-color:var(--line-strong);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .n{color:var(--bg);opacity:.75}
.tab .ic{font-size:15px}

.catintro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 0 6px}
.catintro p{margin:0 0 6px;color:var(--ink-2);max-width:70ch}
.catintro .tag{color:var(--muted);font-size:13px}
.catintro .src{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.catintro .src a{display:block}
@media (max-width:640px){.catintro{grid-template-columns:1fr}.catintro .src{text-align:left;white-space:normal}}
.introlinks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}

.group{margin:22px 0 0}
.group > h3{font:600 12px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;padding:8px 0;border-bottom:2px solid var(--line-strong);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gintro{display:grid;gap:6px;padding:12px 0 2px;color:var(--muted);font-size:14px}
.gintro p{margin:0;max-width:72ch;overflow-wrap:anywhere}
.group > h3 .n{font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)}
.prog{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.prog:last-child{border-bottom:0}
.prog h4{font:700 16px/1.3 var(--font);margin:0;letter-spacing:-.005em;text-wrap:pretty;overflow-wrap:anywhere}
.prog h4 .st{font-weight:500;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.prog .cat-chip{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.prog p{margin:0;color:var(--ink-2);max-width:72ch;white-space:pre-line;overflow-wrap:anywhere}
.prog p.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prog .more{color:var(--accent);font-weight:600;font-size:13px;padding:0;justify-self:start}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.lnk{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0;padding:5px 10px 5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px;line-height:1.2}
.lnk:hover{border-color:var(--accent);color:var(--accent)}
.lnk .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(34ch,72vw);min-width:0}
.lnk .h{color:var(--faint);font-size:11px;white-space:nowrap}
.lnk .i{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;flex:none;font-size:9px;font-weight:700}
.lnk.video .i{background:var(--video-soft);color:var(--video)}
.lnk.document .i,.lnk.pdf .i{background:var(--doc-soft);color:var(--doc)}
.lnk.web .i{background:var(--accent-soft);color:var(--accent)}
.lnk.video:hover{border-color:var(--video);color:var(--video)}
.lnk.document:hover,.lnk.pdf:hover{border-color:var(--doc);color:var(--doc)}
mark{background:var(--hi-soft);color:inherit;padding:0 1px;border-radius:2px}

.empty{padding:40px 0;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.results-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0 4px}
.results-h h2{margin:0;font:700 18px/1.2 var(--font)}
.results-h .scope{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px}
.results-h .scope button{padding:4px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.results-h .scope button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);background:var(--hi-soft);color:var(--ink);font-size:14px;margin:0 0 18px}
.notice .q{font:900 20px/1 var(--display);color:var(--hi-ink);background:var(--hi);width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none}
.notice a{color:inherit;font-weight:600}
footer.ft{max-width:1240px;margin:0 auto;padding:20px 16px 40px;color:var(--faint);font-size:12px;border-top:1px solid var(--line)}
footer.ft a{color:var(--muted)}

/* ---------- state picker dialog ---------- */
dialog.picker{border:0;padding:0;background:transparent;max-width:min(560px,calc(100vw - 24px));width:100%;margin:auto}
dialog.picker::backdrop{background:rgba(10,16,28,.55);backdrop-filter:blur(2px)}
.picker-in{background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.picker-in header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.picker-in header input{flex:1;padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.picker-in header button{padding:8px 10px;color:var(--muted);border-radius:8px}
.picker-in header button:hover{background:var(--surface-2)}
.picker-list{overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px}
.picker-list a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.picker-list a:hover,.picker-list a.active{background:var(--surface-2)}
.picker-list .abbr{font:900 15px/1 var(--display);color:var(--accent);width:28px}
.picker-list .ct{margin-left:auto;color:var(--faint);font-size:12px}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.prog{animation:in .18s ease-out both}}
@keyframes in{from{opacity:.6;transform:translateY(2px)}to{opacity:1;transform:none}}
@media print{.top,.rail,.tabs,.search{display:none!important}.wrap{display:block}.prog{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" id="brand"><span class="brand-mark">?</span><span><b>LeskoHelp State Finder</b><small>Money &amp; help programs, state by state</small></span></a>
    <span class="spacer"></span>
    <label class="search"><span class="sr">Search programs</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search programs, e.g. rent, dental, grants…" autocomplete="off">
      <button class="clear" id="qclear" hidden aria-label="Clear search">✕</button>
    </label>
    <button class="statebtn" id="statebtn" aria-haspopup="dialog"><span class="abbr" id="sb-abbr">US</span><span id="sb-name">Choose your state</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
</header>

<div class="wrap">
  <nav class="rail" aria-label="States"><h2>States</h2><ul id="rail"></ul></nav>
  <main id="main"><div class="loading">Loading programs…</div></main>
</div>
<footer class="ft">Compiled from Matthew Lesko's 50-state "Money &amp; Help" reports for the <a href="https://www.free.lesko.com/home">LeskoHelp.com</a> community. Program details and links come from the original reports; always confirm eligibility with the office listed. <span id="ft-gen"></span></footer>

<dialog class="picker" id="picker"><div class="picker-in">
  <header><input id="pq" type="search" placeholder="Type a state name…" autocomplete="off" aria-label="Filter states"><button id="pclose" aria-label="Close">✕</button></header>
  <div class="picker-list" id="plist"></div>
</div></dialog>

<script id="app-data" type="application/json"></script>
<script>
(function(){
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v);}catch(e){} } };

// ---------------- data ----------------
const inline = (() => { try { const t = $('#app-data').textContent.trim(); return t ? JSON.parse(t) : null; } catch(e){ return null; } })();
const DATA_BASE = (document.currentScript && document.currentScript.dataset.base) || '../data/';
let summary = null;
const stateCache = new Map();
async function loadSummary(){
  if (inline && inline.summary) { summary = inline.summary; return summary; }
  summary = await (await fetch(DATA_BASE + 'summary.json')).json();
  return summary;
}
async function loadState(slug){
  if (stateCache.has(slug)) return stateCache.get(slug);
  let s;
  if (inline && inline.states && inline.states[slug]) s = inline.states[slug];
  else s = await (await fetch(DATA_BASE + 'states/' + slug + '.json')).json();
  stateCache.set(slug, s);
  return s;
}
async function loadAll(){
  if (inline && inline.states) return Object.values(inline.states);
  return Promise.all(summary.states.map(s => loadState(s.slug)));
}

// ---------------- routing ----------------
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'state' && parts[1]) return { view:'state', slug: parts[1], cat: parts[2] || null };
  if (parts[0] === 'search') return { view:'search', scope: parts[1] || 'all' };
  return { view:'home' };
}
function go(hash){ location.hash = hash; }

// ---------------- rendering helpers ----------------
const ICON = { video:'▶', document:'≡', pdf:'PDF', web:'↗' };
function linkChip(l){
  const t = l.type || 'web';
  const label = l.label && l.label !== l.host ? l.label : (t==='video' ? 'Watch video' : l.host);
  const showHost = l.label && t !== 'video' && !l.label.toLowerCase().includes(l.host.toLowerCase());
  return `<a class="lnk ${t}" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="i">${ICON[t]||'↗'}</span><span class="t">${esc(label)}</span>${showHost?`<span class="h">${esc(l.host)}</span>`:''}</a>`;
}
function hl(text, q){
  if (!q) return esc(text);
  const words = q.split(/\s+/).filter(w => w.length > 1).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if (!words.length) return esc(text);
  const re = new RegExp('(' + words.join('|') + ')', 'ig');
  return esc(text).replace(re, '<mark>$1</mark>');
}
function programRow(p, q, ctx){
  const long = p.text && p.text.length > 260;
  return `<article class="prog">
    ${ctx ? `<div class="cat-chip">${esc(ctx)}</div>` : ''}
    <h4>${hl(p.title, q)}</h4>
    ${p.text ? `<p class="${long?'clamp':''}">${hl(p.text, q)}</p>${long?`<button class="more" data-more>Show more</button>`:''}` : ''}
    ${p.links && p.links.length ? `<div class="links">${p.links.map(linkChip).join('')}</div>` : ''}
  </article>`;
}
function matches(p, q){
  if (!q) return true;
  const hay = (p.title + ' ' + (p.text||'') + ' ' + (p.links||[]).map(l => l.label + ' ' + l.host).join(' ')).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

// ---------------- views ----------------
function renderRail(active){
  $('#rail').innerHTML = summary.states.map(s => `<li><a href="#/state/${s.slug}" ${s.slug===active?'aria-current="true"':''}><span>${esc(s.name)}</span><span class="n num">${s.programCount}</span></a></li>`).join('');
  const st = summary.states.find(s => s.slug === active);
  $('#sb-abbr').textContent = st ? st.abbr : 'US';
  $('#sb-name').textContent = st ? st.name : 'Choose your state';
}

function viewHome(){
  const t = summary.totals;
  const cats = summary.categories.filter(c => c.key !== 'other');
  const last = LS.get('lh:state');
  const lastState = summary.states.find(s => s.slug === last);
  return `
  <section class="hero">
    <div>
      <h1>Find free money and help where you live.</h1>
      <p class="lede">Every state has <em>hundreds of programs</em> that pay bills, fund businesses, train you for a better job, cover health care and help you buy a home. Pick your state to see what Matthew found for you.</p>
    </div>
    <div class="totals"><div><b class="num">${t.states}</b><span>States</span></div><div><b class="num">${t.programs.toLocaleString()}</b><span>Programs</span></div><div><b class="num">${t.links.toLocaleString()}</b><span>Links</span></div></div>
  </section>
  ${lastState ? `<div class="notice"><span class="q">?</span><span>Welcome back. Jump straight to <a href="#/state/${lastState.slug}">${esc(lastState.name)}</a>, or pick another state below.</span></div>` : ''}
  <div class="cats">${cats.map(c => `<a class="cat" href="${lastState?`#/state/${lastState.slug}/${c.key}`:'#/'}" data-cat="${c.key}"><span class="ic">${c.icon}</span><span><b>${esc(c.name)}</b><small>${esc(c.tagline)}</small></span></a>`).join('')}</div>
  <div class="grid-h"><h2>Choose your state</h2><span>Program counts per state</span></div>
  <ul class="states">${summary.states.map(s => `<li><a href="#/state/${s.slug}"><span class="abbr">${s.abbr}</span><span class="nm">${esc(s.name)}</span><span class="ct num">${s.programCount} programs</span></a></li>`).join('')}</ul>`;
}

function viewState(st, catKey, q){
  const cats = st.categories.filter(c => c.programCount > 0 || c.sources.length);
  const cat = cats.find(c => c.key === catKey) || cats[0];
  const tabs = `<div class="tabs" role="tablist">${cats.map(c => `<a class="tab" role="tab" aria-selected="${c.key===cat.key}" href="#/state/${st.slug}/${c.key}"><span class="ic">${c.icon}</span>${esc(c.name)}<span class="n">${c.programCount}</span></a>`).join('')}</div>`;
  let body = '';
  if (q) {
    let rows = [];
    for (const c of st.categories) for (const g of c.groups) for (const p of g.programs) if (matches(p,q)) rows.push(programRow(p, q, c.name + (g.title ? ' · ' + g.title : '')));
    body = `<div class="results-h"><h2>${rows.length} match${rows.length===1?'':'es'} in ${esc(st.name)} for “${esc(q)}”</h2><a href="#/search/all">Search all states instead →</a></div>` +
      (rows.length ? `<div class="group">${rows.join('')}</div>` : `<div class="empty"><b>Nothing in ${esc(st.name)} matched.</b>Try a broader word, or search all states.</div>`);
  } else {
    const src = cat.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">Original report${s.modified?` · updated ${s.modified}`:''} ↗</a>`).join('');
    body = `<div class="catintro"><div><div class="tag">${cat.icon} ${esc(cat.blurb || cat.tagline)}</div>${cat.intro ? `<p>${esc(cat.intro)}</p>`:''}${cat.introLinks && cat.introLinks.length ? `<div class="introlinks">${cat.introLinks.map(linkChip).join('')}</div>`:''}</div><div class="src">${src}</div></div>`;
    if (!cat.groups.length) body += `<div class="empty"><b>This report hasn't been added yet.</b>${cat.sources.length ? 'The original document is linked above.' : ''}</div>`;
    body += cat.groups.map(g => {
      const gi = g.intro && ((g.intro.text && g.intro.text.length) || (g.intro.links && g.intro.links.length))
        ? `<div class="gintro">${g.intro.text ? `<p>${esc(g.intro.text)}</p>` : ''}${g.intro.links.length ? `<div class="links">${g.intro.links.map(linkChip).join('')}</div>` : ''}</div>` : '';
      return `<section class="group">${g.title ? `<h3><span>${esc(g.title)}</span><span class="n num">${g.programs.length}</span></h3>` : ''}${gi}${g.programs.map(p => programRow(p, '', '')).join('')}</section>`;
    }).join('');
  }
  return `<div class="shead"><div><h1>${esc(st.name)}</h1><div class="sub"><b class="num">${st.programCount}</b> programs across <b>${cats.length}</b> reports</div></div></div>${tabs}${body}`;
}

async function viewSearch(q, scope){
  const all = await loadAll();
  let rows = [];
  if (q) for (const st of all) for (const c of st.categories) for (const g of c.groups) for (const p of g.programs) if (matches(p,q)) rows.push({st, c, g, p});
  // Group identical federal programs (same title + same links) so a nationwide hit doesn't repeat 52 times.
  const seen = new Map();
  for (const r of rows) {
    const k = r.p.title.toLowerCase() + '|' + (r.p.links||[]).map(l => l.url).sort().join(',');
    if (seen.has(k)) seen.get(k).states.push(r.st.abbr); else seen.set(k, {...r, states:[r.st.abbr]});
  }
  // Rank title matches above ones that only match the body or a link.
  const ql = q.toLowerCase();
  const all2 = [...seen.values()].sort((a,b) => (b.p.title.toLowerCase().includes(ql)?1:0) - (a.p.title.toLowerCase().includes(ql)?1:0) || b.states.length - a.states.length);
  const CAP = 300;
  const uniq = all2.slice(0, CAP);
  const cur = LS.get('lh:state');
  return `<div class="results-h"><h2>${q ? `${all2.length} program${all2.length===1?'':'s'} match “${esc(q)}” across all states${all2.length>CAP?` · showing the first ${CAP}`:''}` : 'Search all states'}</h2>${cur?`<a href="#/state/${cur}">Back to ${esc((summary.states.find(s=>s.slug===cur)||{}).name||'my state')}</a>`:''}</div>
  ${!q ? `<div class="empty"><b>Type a word in the search box.</b>For example “rent”, “dental”, “veteran”, “down payment”.</div>` : uniq.length ? `<div class="group">${uniq.map(r => {
      const scope = r.states.length > 8 ? `Nationwide · listed in ${r.states.length} states` : r.states.length > 1 ? r.states.join(', ') : r.st.name;
      return programRow(r.p, q, scope + ' · ' + r.c.name);
    }).join('')}</div>` : `<div class="empty"><b>No program matched.</b>Try another word.</div>`}`;
}

// ---------------- app ----------------
let q = '';
async function render(){
  const r = route();
  const main = $('#main');
  const qEl = $('#q');
  if (r.view === 'home') {
    renderRail(null);
    main.innerHTML = viewHome();
    document.title = 'LeskoHelp State Finder';
  } else if (r.view === 'state') {
    renderRail(r.slug);
    main.innerHTML = '<div class="loading">Loading…</div>';
    let st;
    try { st = await loadState(r.slug); } catch(e){ main.innerHTML = '<div class="empty"><b>That state isn\'t in the data.</b><a href="#/">Back to all states</a></div>'; return; }
    LS.set('lh:state', r.slug);
    if (r.cat) LS.set('lh:cat', r.cat);
    main.innerHTML = viewState(st, r.cat || LS.get('lh:cat'), q);
    document.title = st.name + ' · LeskoHelp State Finder';
  } else if (r.view === 'search') {
    renderRail(LS.get('lh:state'));
    main.innerHTML = '<div class="loading">Searching all 52 states…</div>';
    main.innerHTML = await viewSearch(q, r.scope);
    document.title = 'Search · LeskoHelp State Finder';
  }
  if (!r.view.startsWith('state') && r.view !== 'search') qEl.value = q = '';
  $('#qclear').hidden = !q;
  if (r.view !== 'search') window.scrollTo({top:0});
}

function openPicker(){
  const d = $('#picker');
  const cur = LS.get('lh:state');
  const draw = (f='') => {
    const list = summary.states.filter(s => !f || s.name.toLowerCase().includes(f) || s.abbr.toLowerCase() === f);
    $('#plist').innerHTML = list.map(s => `<a href="#/state/${s.slug}" class="${s.slug===cur?'active':''}"><span class="abbr">${s.abbr}</span>${esc(s.name)}<span class="ct num">${s.programCount}</span></a>`).join('') || '<div class="empty">No state matches.</div>';
  };
  draw();
  $('#pq').value = '';
  $('#pq').oninput = e => draw(e.target.value.trim().toLowerCase());
  $('#pq').onkeydown = e => { if (e.key === 'Enter') { const a = $('#plist a'); if (a) { d.close(); go(a.getAttribute('href')); } } };
  $('#plist').onclick = e => { if (e.target.closest('a')) d.close(); };
  d.showModal();
  $('#pq').focus();
}

$('#statebtn').addEventListener('click', openPicker);
$('#pclose').addEventListener('click', () => $('#picker').close());
$('#picker').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
let t;
$('#q').addEventListener('input', e => {
  q = e.target.value.trim();
  clearTimeout(t);
  t = setTimeout(() => {
    const r = route();
    if (r.view === 'home' && q) { const s = LS.get('lh:state'); go(s ? `#/state/${s}` : '#/search/all'); }
    else render();
  }, 160);
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const r = route(); if (r.view !== 'search') go('#/search/all'); } });
$('#qclear').addEventListener('click', () => { $('#q').value = q = ''; render(); $('#q').focus(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-more]');
  if (b) { const p = b.previousElementSibling; p.classList.toggle('clamp'); b.textContent = p.classList.contains('clamp') ? 'Show more' : 'Show less'; }
});
window.addEventListener('hashchange', render);
loadSummary().then(() => {
  if (summary.generated) $('#ft-gen').textContent = 'Data extracted ' + summary.generated + '.';
  if (!location.hash && LS.get('lh:state')) { /* stay on home, but show welcome-back notice */ }
  render();
}).catch(err => { $('#main').innerHTML = `<div class="empty"><b>Couldn't load the program data.</b>${esc(err.message)}</div>`; });
})();
</script>
